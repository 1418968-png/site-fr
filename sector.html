<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Сектор | Invest Navigator</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">Invest Navigator</a>
      <nav class="nav-links" aria-label="Основная навигация">
        <a href="index.html">Главная</a>
        <a href="screener.html">Скринер</a>
        <a href="methodology.html">Методология</a>
      </nav>
      <div class="search-shell">
        <label class="visually-hidden" for="global-search">Поиск компаний и секторов</label>
        <input id="global-search" class="global-search" type="search" placeholder="Поиск по компании или тикеру" autocomplete="off">
      </div>
    </header>

    <main id="sector-page">
      <section class="page-head">
        <a class="back-link" href="index.html">Назад к секторам</a>
        <p class="eyebrow">Сектор</p>
        <h1 id="sector-title">Загрузка...</h1>
        <p id="sector-description" class="lead"></p>
        <div class="metric-strip">
          <div class="metric-box">
            <span>Компаний в секторе</span>
            <strong id="sector-count">-</strong>
          </div>
        </div>
      </section>

      <section class="filter-panel sector-controls" aria-label="Фильтры сектора">
        <div class="field">
          <label for="sector-search">Поиск внутри сектора</label>
          <input id="sector-search" type="search" placeholder="Название или тикер" autocomplete="off">
        </div>
        <div class="field">
          <label for="sector-sort">Сортировка</label>
          <select id="sector-sort">
            <option value="ticker-asc">Тикер: А-Я</option>
            <option value="name-asc">Название: А-Я</option>
            <option value="price-desc">Цена: по убыванию</option>
            <option value="change-desc">Изменение: по убыванию</option>
            <option value="pe-asc">P/E: по возрастанию</option>
            <option value="roe-desc">ROE: по убыванию</option>
            <option value="score-desc">Оценка: по убыванию</option>
          </select>
        </div>
        <span id="sector-result-count" class="result-count">0 найдено</span>
      </section>

      <section class="content-section">
        <div class="section-heading">
          <p class="eyebrow">Компании</p>
          <h2>Сравнительная таблица</h2>
        </div>
        <div id="sector-error" class="message error-message" hidden></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Компания</th>
                <th>Тикер</th>
                <th>Цена</th>
                <th>Изменение</th>
                <th>P/E</th>
                <th>P/B</th>
                <th>ROE</th>
                <th>Див. доходность</th>
                <th>Капитализация</th>
                <th>Аналитическая оценка</th>
              </tr>
            </thead>
            <tbody id="sector-companies-body">
              <tr>
                <td colspan="10">Загрузка компаний...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/search.js"></script>
    <script src="js/sectors.js"></script>
  </body>
</html>
