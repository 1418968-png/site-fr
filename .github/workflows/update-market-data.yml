name: Update market data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Update market data
        run: npm run update:market

      - name: Commit updated market JSON
        run: |
          if git diff --quiet -- data/market-data.json data/companies.json data/sectors.json data/price-history.json; then
            echo "Market data has not changed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-data.json data/companies.json data/sectors.json data/price-history.json
          git commit -m "Update market data"
          git push
